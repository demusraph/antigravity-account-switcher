name: "Bug Report"
description: "Report a bug or unexpected behavior in Antigravity Control Center"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please check existing issues before submitting.
  - type: input
    id: version
    attributes:
      label: "Application Version"
      description: "Which version are you running (e.g. v1.0.0, or latest from main)?"
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: dropdown
    id: runtime_mode
    attributes:
      label: "Runtime Mode"
      description: "How are you running the application?"
      options:
        - "Standalone Windows Executable (.exe)"
        - "Python Source (main.py / GUI)"
        - "Headless CLI (--cli)"
        - "Background Daemon (--daemon)"
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: "Operating System Version"
      description: "e.g., Windows 11 Pro 23H2 (build 22631)"
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened instead?"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the problem."
      placeholder: |
        1. Open Antigravity Control Center
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs / Crash Output"
      description: "Paste output from %USERPROFILE%\\.gemini\\antigravity-switcher\\app_crash.log or autopilot.log (remove any private information)."
      render: shell
